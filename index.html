<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบายน้ำ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #fdf6e3; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="p-4 max-w-md mx-auto min-h-screen pb-12">

  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden justify-center items-center p-4 backdrop-blur-sm" onclick="closeModal()">
    <button class="absolute top-4 right-4 text-white text-4xl hover:text-orange-500 font-bold focus:outline-none transition">&times;</button>
    <img id="modal-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
  </div>

  <div class="bg-white rounded-2xl shadow-sm overflow-hidden mb-6 border border-orange-100">
    <img id="cat-img" src="https://via.placeholder.com/400x250?text=Loading..." class="w-full h-64 object-cover bg-gray-200" alt="Cat Image">
    <div class="p-5">
      <h1 id="cat-name" class="text-2xl font-bold text-gray-800">กำลังโหลด...</h1>
      <p id="cat-desc" class="text-gray-600 mt-2 text-sm leading-relaxed"></p>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-5 mb-6 border border-orange-100">
    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">📝 บันทึกการดูแลน้อง</h2>
    <label class="block text-sm font-semibold text-gray-700 mb-1">กิจกรรม:</label>
    <select id="action" class="w-full p-3 border border-gray-200 rounded-xl mb-4 bg-gray-50 focus:ring-2 focus:ring-orange-400 outline-none transition">
      <option value="🍚 ให้ข้าว/ให้น้ำ">🍚 ให้ข้าว/ให้น้ำ</option>
      <option value="🍢 ให้แมวเลีย/ขนม">🍢 ให้แมวเลีย/ขนม</option>
      <option value="🧻 เช็ดตัว/ทำความสะอาด">🧻 เช็ดตัว/ทำความสะอาด</option>
      <option value="💬 แวะมาหา/รีวิว">💬 แวะมาหา/รีวิว</option>
    </select>

    <label class="block text-sm font-semibold text-gray-700 mb-1">คอมเมนต์ / รีวิว:</label>
    <textarea id="comment" rows="2" class="w-full p-3 border border-gray-200 rounded-xl mb-4 bg-gray-50 focus:ring-2 focus:ring-orange-400 outline-none transition" placeholder="เช่น วันนี้น้องกินหมดจาน..."></textarea>

    <label class="block text-sm font-semibold text-gray-700 mb-1">อัปโหลดรูปถ่าย (ไม่บังคับ):</label>
    <input type="file" id="upload-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 mb-5 cursor-pointer transition">

    <button onclick="submitForm()" id="submit-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-md transition duration-200">
      บันทึกข้อมูล
    </button>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-5 border border-orange-100">
    <h2 class="text-lg font-bold text-gray-800 mb-4 flex justify-between items-center">
      <span>📜 ประวัติย้อนหลัง</span>
      <button onclick="refreshLogs()" class="text-xs text-orange-500 hover:bg-orange-50 py-1 px-2 rounded border border-orange-200">🔄 โหลดใหม่</button>
    </h2>
    
    <div id="logs-container" class="space-y-4">
      <div id="initial-loader" class="text-center py-4"><span class="loader"></span></div>
    </div>

    <div class="mt-6 text-center">
      <button id="load-more-btn" onclick="loadMoreData()" class="hidden w-full bg-orange-50 text-orange-600 font-semibold py-3 rounded-xl border border-orange-200 hover:bg-orange-100 transition duration-200">
        ดูประวัติเก่าเพิ่มเติม 👇
      </button>
      <div id="load-more-spinner" class="hidden py-3"><span class="loader border-orange-400"></span></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'ใhttps://script.google.com/macros/s/AKfycbzDfTlWaCiQwRYP83cado_3hCYyIGkzwG6c-vJ7fx1TYFzRNAL6UmtY0-zWpwnJsawVoQ/exec'; 
    
    let currentPage = 1;

    function openModal(imageSrc) {
      document.getElementById('modal-img').src = imageSrc;
      document.getElementById('image-modal').classList.remove('hidden');
      document.getElementById('image-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.add('hidden');
      document.getElementById('image-modal').classList.remove('flex');
    }

    function createLogHTML(log) {
      let dateObj = new Date(log[0]);
      let timeString = isNaN(dateObj) ? log[0] : dateObj.toLocaleString('th-TH', { 
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' 
      });
      
      var html = `
        <div class="flex justify-between items-center text-xs text-gray-400 mb-1.5"><span>⏰ ${timeString} น.</span></div>
        <div class="font-bold text-gray-800 text-sm">${log[1]}</div>
        ${log[2] ? `<div class="text-gray-600 bg-orange-50/50 p-2.5 rounded-lg mt-2 mb-2 text-sm border border-orange-100/50">${log[2]}</div>` : ''}
      `;
      
      if(log[3]) {
        html += `<img src="${log[3]}" loading="lazy" onclick="openModal('${log[3]}')" class="w-full h-48 object-cover rounded-xl mt-3 shadow-sm border border-gray-200 cursor-pointer hover:opacity-85 transition duration-200" alt="Review">`;
      }
      return html;
    }

    async function fetchPageData(page, isAppend = false) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData&page=${page}`);
        const data = await response.json();
        
        if (page === 1 && data.profile) {
          document.getElementById('cat-name').innerText = data.profile.name;
          document.getElementById('cat-img').src = data.profile.imageUrl;
          document.getElementById('cat-desc').innerText = data.profile.description;
        }

        var container = document.getElementById('logs-container');
        
        if (!isAppend) {
          container.innerHTML = '';
        } else {
          var loader = document.getElementById('initial-loader');
          if(loader) loader.remove();
        }
        
        if(data.logs.length === 0 && page === 1) {
          container.innerHTML = '<p class="text-gray-400 text-center text-sm py-4">ยังไม่มีใครบันทึกเลย เป็นคนแรกสิ! 🎉</p>';
          document.getElementById('load-more-btn').classList.add('hidden');
          return;
        }

        data.logs.forEach(function(log) {
          var item = document.createElement('div');
          item.className = "border-b border-gray-100 pb-4 last:border-0 pt-2";
          item.innerHTML = createLogHTML(log);
          container.appendChild(item);
        });

        var loadMoreBtn = document.getElementById('load-more-btn');
        if (data.hasMore) {
          loadMoreBtn.classList.remove('hidden');
        } else {
          loadMoreBtn.classList.add('hidden');
          if(page > 1) {
             let endMsg = document.createElement('div');
             endMsg.className = "text-center text-gray-400 text-xs mt-4 pb-2";
             endMsg.innerText = "สุดทางแล้วจ้า หมดประวัติแล้ว 🐈";
             container.appendChild(endMsg);
          }
        }
        
      } catch (error) {
        if(!isAppend) {
          document.getElementById('logs-container').innerHTML = '<p class="text-red-500 text-center py-4">ไม่สามารถโหลดข้อมูลได้</p>';
        } else {
          alert('ไม่สามารถโหลดข้อมูลเพิ่มเติมได้');
        }
      }
    }

    function initLoad() {
      currentPage = 1;
      fetchPageData(1, false);
    }

    async function loadMoreData() {
      let btn = document.getElementById('load-more-btn');
      let spinner = document.getElementById('load-more-spinner');
      
      btn.classList.add('hidden');
      spinner.classList.remove('hidden');
      
      currentPage++; // เพิ่มเลขหน้า
      await fetchPageData(currentPage, true);
      
      spinner.classList.add('hidden');
    }

    function refreshLogs() {
      document.getElementById('logs-container').innerHTML = '<div id="initial-loader" class="text-center py-4"><span class="loader"></span></div>';
      document.getElementById('load-more-btn').classList.add('hidden');
      initLoad();
    }

    async function submitForm() {
      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader" style="width:20px;height:20px;border-width:3px;"></span> กำลังบันทึก...';
      btn.classList.replace('bg-orange-500', 'bg-gray-400');

      var file = document.getElementById('upload-image').files[0];
      var payload = {
        action: document.getElementById('action').value,
        comment: document.getElementById('comment').value,
        base64Data: null,
        fileName: null
      };

      if (file) {
        var reader = new FileReader();
        reader.onload = async function(e) {
          payload.base64Data = e.target.result.split(',')[1];
          payload.fileName = "cat_" + Date.now() + "." + file.name.split('.').pop();
          sendPostRequest(payload);
        };
        reader.readAsDataURL(file);
      } else {
        sendPostRequest(payload);
      }
    }

    async function sendPostRequest(payload) {
      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        resetForm();
      } catch (error) {
        alert('บันทึกสำเร็จ');
        resetForm();
      }
    }

    function resetForm() {
      document.getElementById('comment').value = '';
      document.getElementById('upload-image').value = '';
      var btn = document.getElementById('submit-btn');
      btn.disabled = false;
      btn.innerHTML = 'บันทึกข้อมูล';
      btn.classList.replace('bg-gray-400', 'bg-orange-500');
      
      refreshLogs();
    }

    initLoad();
  </script>
</body>
</html>
